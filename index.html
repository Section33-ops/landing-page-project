<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Landing Page</title>
  </head>
  <body>
    <div class="container">
      <header>
        <nav>
          <a href="">Home</a>
          <a href="">Portfolio</a>
          <a href="">Contact</a>
        </nav>

        <h1>John Paul: Capture Your Story</h1>
      </header>
      <main>
        <!--Hero Section-->
        <section>
          <div class="hero_section">
            <h2>Let's Capture Your Story Together</h2>
          </div>
        </section>

        <!--Portfolio Section-->
        <section>
          <h2>My Portfolio:</h2>
          <div class="grid_container">
            <!-- Portfolio images go here -->
            <img src="images/img.jpg" alt="a placeholder image" />
            <img src="images/img2.jpg" alt="a placeholder image" />
            <img src="images/img3.jpg" alt="a placeholder image" />
          </div>
        </section>

        <!--Contact Form Section-->
        <section>
          <div class="form_section">
            <form action="">
              <label for="name">Name:</label>
              <input type="text" name="name" id="name" required />
              <br />

              <label for="email">Email:</label>
              <input type="email" name="email" id="email" required />
              <br />

              <label for="message">Message:</label>
              <textarea
                name="message"
                id="message"
                cols="30"
                rows="10"
              ></textarea>
              <br />

              <input type="submit" value="Submit" />
            </form>
          </div>
        </section>
      </main>
    </div>
    <footer></footer>
  </body>
</html>
